name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - extrator-front-back

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  containers:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          DB_USER=mentary
          DB_PASSWORD=mentary_ci_password
          DB_NAME=mentary_ci
          DATABASE_URL=postgresql://mentary:mentary_ci_password@db:5432/mentary_ci
          DB_SSL=false
          EOF

      - name: Start services
        run: docker compose up --build -d

      - name: Wait for services
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5173 >/dev/null &&
               curl --fail --silent http://localhost:3000/health >/dev/null &&
               curl --fail --silent http://localhost:3000/health/db >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Stop services
        if: always()
        run: docker compose down -v
